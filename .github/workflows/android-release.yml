name: Android Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'ports/android/**'
      - 'tools/android/**'
      - 'tools/triaevum_release/**'
      - 'runtime/**'
      - 'CMakeLists.txt'
      - 'CMake/**'
      - 'scripts/**'
      - '.github/workflows/android-release.yml'
  pull_request:
    paths:
      - 'ports/android/**'
      - 'tools/android/**'
      - 'tools/triaevum_release/**'
      - 'runtime/**'
      - 'CMakeLists.txt'
      - 'CMake/**'
      - 'scripts/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publicar una release de GitHub'
        required: true
        type: boolean
        default: false
      release_tag:
        description: 'Etiqueta de release (ej. v0.6.0-android-alpha.1)'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Marcar como pre-release'
        required: true
        type: boolean
        default: true
      rom_url:
        description: 'URL directa de una ROM OoT3D propia (opcional; no se publica)'
        required: false
        type: string
        default: ''
      source_zip_url:
        description: 'URL de source.zip AOT previamente generado (opcional)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake unzip libvulkan-dev

      - name: Configure Android NDK r29
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "y" | "$SDKMANAGER" --install "ndk;29.0.14206865" "platforms;android-35" "build-tools;35.0.0"
          NDK_DIR="$ANDROID_HOME/ndk/29.0.14206865"
          test -d "$NDK_DIR"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDK=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Prepare title source
        env:
          ROM_URL: ${{ github.event.inputs.rom_url || secrets.OOT3D_ROM_URL }}
          SOURCE_ZIP_URL: ${{ github.event.inputs.source_zip_url || secrets.SOURCE_ZIP_URL }}
        run: |
          mkdir -p title-source work-ir
          if [ -f source.zip ]; then
            unzip -q source.zip -d title-source
          elif [ -n "$SOURCE_ZIP_URL" ]; then
            curl --fail --location --retry 3 "$SOURCE_ZIP_URL" -o source.zip
            unzip -q source.zip -d title-source
          fi
          if [ -d title-source/source ]; then
            cp -a title-source/source/. title-source/
          elif [ -d title-source/translated-sources ]; then
            cp -a title-source/translated-sources/. title-source/
          fi
          if [ ! -f title-source/TITLE_SOURCE_MANIFEST.json ] && [ -n "$ROM_URL" ]; then
            curl --fail --location --retry 3 "$ROM_URL" -o game_rom.3ds
            python3 tools/android/generate_title_from_rom.py \
              --rom game_rom.3ds \
              --work-dir work-ir \
              --output title-source
          fi
          test -f title-source/TITLE_SOURCE_MANIFEST.json || {
            echo 'ERROR: no verified title source was supplied.'
            echo 'Provide a private OOT3D_ROM_URL/SOURCE_ZIP_URL secret or workflow input.'
            exit 1
          }
          test "$(find title-source -maxdepth 1 -name '*.cpp' | wc -l)" -gt 0

      - name: Build Android runtime
        run: |
          cmake -S ports/android/runtime -B build/runtime -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_BUILD_PARALLEL_LEVEL=3
          ninja -C build/runtime -j3 oot3d_native_game

      - name: Build verified whole-AOT title
        run: |
          cmake -S ports/android/native -B build/native_title -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DTRIAEVUM_ANDROID_BUILD_NRI=OFF \
            -DTRIAEVUM_TRANSLATED_TITLE_DIR="$(pwd)/title-source" \
            -DTRIAEVUM_ANDROID_TITLE_OPTIMIZATION=1 \
            -DTRIAEVUM_ANDROID_TITLE_DEBUG_INFO=OFF
          ninja -C build/native_title -j2 triaevum_android_title
          mkdir -p build/title
          cp build/native_title/libtriaevum_title_aot.so build/title/
          LLVM_READELF="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$LLVM_READELF" -l build/title/libtriaevum_title_aot.so | grep -q '0x4000'
          "$LLVM_READELF" --dyn-syms build/title/libtriaevum_title_aot.so | grep -q triaevum_title_whole_aot_query

      - name: Stage native libraries
        run: |
          python3 tools/android/stage_native_app.py \
            --runtime-build build/runtime \
            --title-module "$(pwd)/build/title/libtriaevum_title_aot.so" \
            --ndk "$ANDROID_NDK_ROOT" \
            --output build/staged_native_libs

      - name: Test Android controls
        run: |
          chmod +x ports/android/gradlew
          ports/android/gradlew -p ports/android :controls:testDebugUnitTest --console=plain

      - name: Build APK
        run: |
          ports/android/gradlew -p ports/android :app:assembleDebug \
            -PtriaevumSdlSource="$(pwd)/build/runtime/_deps/sdl2-src" \
            -PtriaevumNativeStage="$(pwd)/build/staged_native_libs" \
            --console=plain

      - name: Verify APK
        run: |
          APK=ports/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p dist
          cp "$APK" dist/TriAevum-Oot3D-Android-arm64-v8a-debug.apk

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: TriAevum-Oot3D-Android-arm64-v8a
          path: dist/TriAevum-Oot3D-Android-arm64-v8a-debug.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: ${{ github.event.inputs.release_tag || github.ref_name }}
          prerelease: ${{ github.event.inputs.prerelease || true }}
          files: dist/TriAevum-Oot3D-Android-arm64-v8a-debug.apk
          generate_release_notes: true
